server:
  port: 9090

spring:
  application:
    name: kids-care
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地开发默认值；部署时请用环境变量 DB_URL / DB_USERNAME / DB_PASSWORD 覆盖
    url: ${DB_URL:jdbc:mysql://localhost:3306/kids_care?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 需要看 SQL 时改为 org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.kids.care: info
  file:
    name: logs/kids-care.log
